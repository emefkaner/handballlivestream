name: Kalender bauen und veröffentlichen

on:
  # Zweimal täglich: früh und am späten Nachmittag (UTC; im Sommer +2 h).
  # Damit sind Verlegungen und Absagen spätestens am nächsten Morgen drin —
  # einmal wöchentlich wäre zu selten, wenn kurzfristig etwas abgesagt wird.
  # Achtung: GitHub schaltet Zeitpläne in Repos ab, in denen 60 Tage lang
  # nichts passiert, und schickt vorher eine Mail. Dann unter "Actions" auf
  # "Enable workflow" klicken.
  schedule:
    - cron: '25 4,15 * * *'
  # Nach jeder Änderung am Generator.
  push:
    branches: [main]
    # Der eigene Ergebnis-Commit soll keinen weiteren Lauf auslösen.
    paths-ignore:
      - 'docs/**'
  # Und auf Knopfdruck unter "Actions".
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Ein Lauf zur Zeit; einen bereits laufenden nicht abbrechen.
concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    outputs:
      pages_bereit: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kalender erzeugen
        env:
          # Repository-Variable OHNE_DIENSTPLAN auf '1' setzen, wenn im
          # Kalender keine Namen stehen sollen (dann bleibt es beim Spielplan).
          OHNE_DIENSTPLAN: ${{ vars.OHNE_DIENSTPLAN }}
        run: npm run build

      - name: Erzeugte Dateien prüfen
        run: npm test

      # Der verlässliche Weg: Das Ergebnis liegt im Repo selbst und ist damit
      # sofort über raw.githubusercontent.com abrufbar — ohne dass jemand
      # GitHub Pages einrichten muss.
      - name: Ergebnis ins Repo schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if git diff --cached --quiet; then
            echo "Keine Änderung am Kalender — nichts zu committen."
          else
            git commit -m "Kalender aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      # Der bequemere Weg, falls GitHub Pages eingerichtet ist. Scheitert das,
      # läuft der Rest trotzdem durch: die Datei liegt ja schon im Repo.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    needs: bauen
    if: needs.bauen.outputs.pages_bereit == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
